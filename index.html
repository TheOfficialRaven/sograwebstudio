<!DOCTYPE html>
<html lang="hu">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SOGRA Web Studio | Fejlesztés alatt</title>
    <meta
      name="description"
      content="A SOGRA Web Studio weboldala jelenleg fejlesztés alatt áll. Addig is egyedi weboldalakon és kreatív webdesign projekteken dolgozunk."
    />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#FFFFFF" />

    <link rel="icon" href="assets/imgs/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="assets/imgs/Sogra_logo.png" type="image/png" sizes="any" />
    <link rel="apple-touch-icon" href="assets/imgs/Sogra_logo.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <main class="page">
      <header class="logo-wrap">
        <div class="logo">
          <picture>
            <source
              srcset="assets/imgs/Sogra_logo.webp"
              type="image/webp"
            />
            <img
              class="logo-image"
              src="assets/imgs/Sogra_logo.png"
              alt="SOGRA Webstudio"
              width="1600"
              height="802"
              decoding="async"
            />
          </picture>
        </div>
      </header>

      <section class="hero" aria-labelledby="page-title">
        <div class="title-block">
          <span class="accent accent--teal" aria-hidden="true"></span>
          <span class="accent accent--yellow" aria-hidden="true"></span>
          <span class="accent accent--green" aria-hidden="true"></span>
          <span class="accent accent--teal-soft" aria-hidden="true"></span>
          <span class="accent accent--yellow-soft" aria-hidden="true"></span>

          <h1 id="page-title">Weboldalunk jelenleg fejlesztés alatt áll</h1>
        </div>

        <p class="description">
          A weboldalkészítés a mi világunk. A saját oldalunk mégis a várólistán
          van – mert most mások ötleteit váltjuk valóra.
        </p>
      </section>

      <!-- Illusztráció később: assets/imgs/Sogra_ideiglenes.jpg -->

      <p class="thanks">Köszönjük a türelmet!</p>

      <nav class="contact" aria-label="Elérhetőségek">
        <p class="contact-label">Addig itt elérhetőek vagyunk:</p>
        <ul class="contact-list">
          <li>
            <a
              class="contact-link contact-link--facebook"
              href="https://www.facebook.com/profile.php?id=61596508088657"
              target="_blank"
              rel="noopener noreferrer"
              aria-label="Facebook"
            >
              <svg
                class="contact-icon"
                viewBox="0 0 24 24"
                width="22"
                height="22"
                aria-hidden="true"
                focusable="false"
              >
                <path
                  fill="currentColor"
                  d="M14 8.2h2.1V5h-2.1C11.6 5 10 6.7 10 9.2V11H8v3.2h2V21h3.2v-6.8h2.4L16 11h-2.8V9.4c0-.7.3-1.2.8-1.2z"
                />
              </svg>
              <span>Facebook</span>
            </a>
          </li>
          <li>
            <a
              class="contact-link contact-link--email"
              href="mailto:info@sograwebstudio.com"
            >
              <svg
                class="contact-icon"
                viewBox="0 0 24 24"
                width="22"
                height="22"
                aria-hidden="true"
                focusable="false"
              >
                <path
                  fill="currentColor"
                  d="M20 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4-8 5L4 8V6l8 5 8-5v2z"
                />
              </svg>
              <span>info@sograwebstudio.com</span>
            </a>
          </li>
        </ul>
      </nav>
    </main>
  </body>
</html>
